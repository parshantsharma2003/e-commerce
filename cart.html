<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>MyMart | Cart</title>
  <link rel="stylesheet" href="e.css"/>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="top-row">
    <h1 class="logo">MyMart</h1>
    <div class="nav-right">
      <a href="e.html" class="cart">🏠 Shop</a>
      <a href="cart.html" class="cart">
        🛒 Cart <span class="cart-badge" id="cart-count">0</span>
      </a>
    </div>
  </div>
</nav>

<!-- CART CONTAINER -->
<div id="cartContainer">
  <h2>🛍️ Your Shopping Cart</h2>

  <div id="cartItems"></div>

  <!-- SUMMARY -->
  <div class="cart-summary">
    <div class="summary-row">
      <span>Total Amount</span>
      <strong>₹<span id="total">0</span></strong>
    </div>

    <button id="checkoutBtn">
      Proceed to Checkout →
    </button>
  </div>
</div>

<script src="auth.js"></script>
<script src="cart.js"></script>

<script>
  const user = JSON.parse(localStorage.getItem("loggedInUser"));
  if (user) {
    document.getElementById("cart-count").innerText =
      JSON.parse(localStorage.getItem("cart") || "[]")
        .reduce((sum, i) => sum + (i.qty || 1), 0);
  }
</script>

</body>
</html>
